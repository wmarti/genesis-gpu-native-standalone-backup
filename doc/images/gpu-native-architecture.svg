<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
<title id="title">GENESIS native GPU architecture</title>
<desc id="desc">One MPI rank drives one GPU. The host owns setup, step control, barostat scalars and output boundaries. GPU state, force evaluation, PME, constraints, integration, thermostat and domain work remain on the device. Neighboring ranks exchange halos, forces, migrating atoms and PME mesh data through peer transfers or MPI. Boxes group responsibilities rather than timestep order.</desc>
