<text x="52" y="78" fill="#15263c" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" text-anchor="start">GPU native architecture</text>
<text x="52" y="120" fill="#52657a" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">One MPI rank per GPU. The MD state remains on the device.</text>
